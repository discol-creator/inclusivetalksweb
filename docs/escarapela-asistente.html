<!doctype html>
<!--
  Escarapela de asistente · Inclusive Talks Medellín 2026
  Fuente: diseño "Inclusive Talks · Lanzamiento Medellín" (Claude Design), página EscarapelaAsistente.
  Plantilla de referencia para generar el PNG en el servidor (400 × 600 px; exportar a 2x = 800 × 1200 px).
  Variables: {{nombre}}, {{organizacion}}, {{codigo}}, {{qr}} (imagen del QR que codifica el código personal).
  Cambio frente al diseño: se agrega el código personal en texto debajo del QR.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escarapela asistente · Inclusive Talks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div style="position:relative;width:400px;height:600px;background:#F2F8FC;overflow:hidden;font-family:'Inter',sans-serif;box-sizing:border-box;">

  <div aria-hidden="true" style="position:absolute;right:0;top:0;width:120px;height:100px;background-image:radial-gradient(circle,#0EA5E9 2.8px,transparent 3.2px);background-size:15px 15px;background-position:8px 8px;"></div>
  <div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:150px;height:130px;background-image:radial-gradient(circle,#0EA5E9 2.8px,transparent 3.2px);background-size:15px 15px;background-position:8px 8px;"></div>
  <div aria-hidden="true" style="position:absolute;left:-110px;bottom:-110px;width:320px;height:320px;border-radius:50%;background:rgba(14,165,233,0.09);"></div>

  <div style="position:relative;z-index:1;height:100%;box-sizing:border-box;padding:40px 32px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">

    <div style="display:flex;align-items:baseline;font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;margin-bottom:14px;">
      <span style="color:#0EA5E9;">i</span><span style="color:#1A1A1A;">nclusive&nbsp;talks</span><span style="color:#0EA5E9;">.</span>
    </div>

    <span style="display:inline-flex;padding:6px 18px;border-radius:999px;border:1.5px solid #1A1A1A;color:#1A1A1A;font-family:'Poppins',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:28px;">Asistente</span>

    <h1 style="margin:0 0 6px;font-family:'Poppins',sans-serif;font-weight:800;font-size:28px;color:#1A1A1A;">{{nombre}}</h1>
    <p style="margin:0 0 24px;font-weight:500;font-size:14px;color:#595959;">{{organizacion}}</p>

    <div style="width:48px;height:3px;background:#0EA5E9;margin-bottom:20px;"></div>

    <div style="display:flex;align-items:center;justify-content:center;gap:26px;margin-bottom:22px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:42px;height:42px;border-radius:50%;background:rgba(26,26,26,0.055);display:flex;align-items:center;justify-content:center;">
          <svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="13" cy="15" r="9" stroke="#0EA5E9" stroke-width="2.4"/><circle cx="19" cy="7" r="3.2" fill="#0EA5E9"/></svg>
        </div>
        <span style="font-weight:600;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:#595959;">Curiosidades</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:42px;height:42px;border-radius:50%;background:rgba(26,26,26,0.055);display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="20" viewBox="0 0 28 30" fill="none" aria-hidden="true"><rect x="3" y="17" width="5" height="8" rx="1.5" fill="#D9DCDF"/><rect x="11.5" y="12" width="5" height="13" rx="1.5" fill="#7DD3FC"/><rect x="20" y="5" width="5" height="20" rx="1.5" fill="#0EA5E9"/><circle cx="22.5" cy="2.5" r="2.4" fill="#1A1A1A"/></svg>
        </div>
        <span style="font-weight:600;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:#595959;">Tips</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:42px;height:42px;border-radius:50%;background:rgba(26,26,26,0.055);display:flex;align-items:center;justify-content:center;">
          <svg width="24" height="10" viewBox="0 0 32 12" fill="none" aria-hidden="true"><circle cx="4" cy="6" r="4" fill="#1A1A1A"/><rect x="10" y="5" width="12" height="2" rx="1" fill="#D9DCDF"/><circle cx="28" cy="6" r="4" fill="#0EA5E9"/></svg>
        </div>
        <span style="font-weight:600;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;color:#595959;">Debate</span>
      </div>
    </div>

    <div style="width:84px;height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;">
      <img src="{{qr}}" width="84" height="84" alt="Código QR con tu código personal">
    </div>
    <p style="margin:0 0 12px;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.08em;color:#1A1A1A;">{{codigo}}</p>

    <p style="margin:0;font-size:11px;color:#595959;">Segunda edición · Medellín</p>
    <p style="margin:2px 0 0;font-size:11px;color:#595959;">04 de diciembre, 2026</p>
  </div>
</div>
</body>
</html>
