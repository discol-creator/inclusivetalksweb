<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escarapela asistente — Inclusive Talks</title>

<!--
  ESCARAPELA DE ASISTENTE · Inclusive Talks
  ------------------------------------------
  Archivo HTML + CSS autocontenido, sin dependencias de ningún framework.
  Funciona igual en cualquier stack: PHP, Node/Express, Python/Django/Flask,
  Ruby, Java, WordPress, un sitio estático, etc.

  CÓMO RELLENAR LOS DATOS (dos formas, usa la que te convenga):

  1) DESDE EL BACKEND (cualquier lenguaje):
     Busca y reemplaza estos tokens en el HTML antes de servirlo:
       {{NOMBRE}}         -> nombre completo del asistente
       {{ORGANIZACION}}   -> organización / cargo (opcional, puede ir vacío)
       {{FECHA}}          -> fecha del evento, ej: "04 de diciembre, 2026"
       {{QR_SRC}}         -> URL o data-URI de la imagen del código QR

     Ejemplo en PHP:
       $html = file_get_contents('escarapela-asistente.html');
       $html = str_replace('{{NOMBRE}}', htmlspecialchars($nombre), $html);

  2) DESDE EL NAVEGADOR (JavaScript, sin backend):
     Usa la función generateBadge() incluida al final de este archivo.
     Ejemplo:
       generateBadge(document.querySelector('.escarapela'), {
         nombre: 'Laura Gómez',
         organizacion: 'Fundación Avanza',
         fecha: '04 de diciembre, 2026',
         qrSrc: 'https://tu-dominio.com/qr/laura-gomez.png'
       });

  Tamaño: 400 x 600 px (proporción 2:3, pensada para imprimir como escarapela).
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:ital,wght@0,400;0,500;0,600;1,600&display=swap">

<style>
  :root {
    --it-blue: #0EA5E9;
    --it-blue-dark: #0369A1;
    --it-black: #1A1A1A;
    --it-gray-text: #595959;
    --it-gray-line: #D9DCDF;
    --it-bg: #F2F8FC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #e9edf1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .escarapela {
    position: relative;
    width: 400px;
    height: 600px;
    background: var(--it-bg);
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
  }

  .escarapela__pattern {
    position: absolute;
    pointer-events: none;
    background-image: radial-gradient(circle, var(--it-blue) 2.8px, transparent 3.2px);
    background-size: 15px 15px;
    background-position: 8px 8px;
  }
  .escarapela__pattern--top-right { right: 0; top: 0; width: 120px; height: 100px; }
  .escarapela__pattern--bottom-left { left: 0; bottom: 0; width: 150px; height: 130px; }

  .escarapela__glow {
    position: absolute;
    pointer-events: none;
    left: -110px;
    bottom: -110px;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: rgba(14,165,233,0.09);
  }

  .escarapela__content {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 40px 32px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .escarapela__logo {
    display: flex;
    align-items: baseline;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 20px;
    margin-bottom: 14px;
  }
  .escarapela__logo .dot { color: var(--it-blue); }
  .escarapela__logo .word { color: var(--it-black); }

  .escarapela__pill {
    display: inline-flex;
    padding: 6px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--it-black);
    color: var(--it-black);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .escarapela__name {
    margin: 0 0 6px;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--it-black);
  }

  .escarapela__org {
    margin: 0 0 24px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--it-gray-text);
  }

  .escarapela__divider {
    width: 48px;
    height: 3px;
    background: var(--it-blue);
    margin-bottom: 20px;
  }

  .escarapela__axes {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 26px;
    margin-bottom: 22px;
  }
  .escarapela__axis {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .escarapela__axis-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(26,26,26,0.055);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .escarapela__axis-label {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--it-gray-text);
  }

  .escarapela__qr {
    width: 84px;
    height: 84px;
    border: 1.5px dashed var(--it-gray-line);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .escarapela__qr img { width: 100%; height: 100%; object-fit: contain; }
  .escarapela__qr span {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--it-gray-text);
  }

  .escarapela__footer {
    margin: 0;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 11px;
    color: var(--it-gray-text);
  }
  .escarapela__footer + .escarapela__footer { margin-top: 2px; }

  /* En pantalla se ve con sombra y centrada; al imprimir, a tamaño real sin fondo gris */
  @media print {
    body { background: #fff; min-height: 0; }
    .escarapela { box-shadow: none; }
  }
</style>
</head>
<body>

  <div class="escarapela">
    <div class="escarapela__pattern escarapela__pattern--top-right" aria-hidden="true"></div>
    <div class="escarapela__pattern escarapela__pattern--bottom-left" aria-hidden="true"></div>
    <div class="escarapela__glow" aria-hidden="true"></div>

    <div class="escarapela__content">

      <div class="escarapela__logo">
        <span class="dot">i</span><span class="word">nclusive&nbsp;talks</span><span class="dot">.</span>
      </div>

      <span class="escarapela__pill">Asistente</span>

      <h1 class="escarapela__name" data-field="nombre">{{NOMBRE}}</h1>
      <p class="escarapela__org" data-field="organizacion">{{ORGANIZACION}}</p>

      <div class="escarapela__divider"></div>

      <div class="escarapela__axes">
        <div class="escarapela__axis">
          <div class="escarapela__axis-icon">
            <svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="13" cy="15" r="9" stroke="#0EA5E9" stroke-width="2.4"/><circle cx="19" cy="7" r="3.2" fill="#0EA5E9"/></svg>
          </div>
          <span class="escarapela__axis-label">Curiosidades</span>
        </div>
        <div class="escarapela__axis">
          <div class="escarapela__axis-icon">
            <svg width="18" height="20" viewBox="0 0 28 30" fill="none" aria-hidden="true"><rect x="3" y="17" width="5" height="8" rx="1.5" fill="#D9DCDF"/><rect x="11.5" y="12" width="5" height="13" rx="1.5" fill="#7DD3FC"/><rect x="20" y="5" width="5" height="20" rx="1.5" fill="#0EA5E9"/><circle cx="22.5" cy="2.5" r="2.4" fill="#1A1A1A"/></svg>
          </div>
          <span class="escarapela__axis-label">Tips</span>
        </div>
        <div class="escarapela__axis">
          <div class="escarapela__axis-icon">
            <svg width="24" height="10" viewBox="0 0 32 12" fill="none" aria-hidden="true"><circle cx="4" cy="6" r="4" fill="#1A1A1A"/><rect x="10" y="5" width="12" height="2" rx="1" fill="#D9DCDF"/><circle cx="28" cy="6" r="4" fill="#0EA5E9"/></svg>
          </div>
          <span class="escarapela__axis-label">Debate</span>
        </div>
      </div>

      <div class="escarapela__qr" data-field="qr">
        <span>QR</span>
      </div>

      <p class="escarapela__footer">Segunda edición · Medellín</p>
      <p class="escarapela__footer" data-field="fecha">{{FECHA}}</p>

    </div>
  </div>

  <script>
    /**
     * Rellena una escarapela con los datos de un asistente.
     * container: el elemento .escarapela (o un contenedor que lo tenga dentro)
     * data: { nombre, organizacion, fecha, qrSrc }
     */
    function generateBadge(container, data) {
      if (!container) return;
      data = data || {};

      var nombreEl = container.querySelector('[data-field="nombre"]');
      if (nombreEl && data.nombre) nombreEl.textContent = data.nombre;

      var orgEl = container.querySelector('[data-field="organizacion"]');
      if (orgEl && typeof data.organizacion !== 'undefined') orgEl.textContent = data.organizacion;

      var fechaEl = container.querySelector('[data-field="fecha"]');
      if (fechaEl && data.fecha) fechaEl.textContent = data.fecha;

      var qrEl = container.querySelector('[data-field="qr"]');
      if (qrEl && data.qrSrc) {
        qrEl.innerHTML = '';
        var img = document.createElement('img');
        img.src = data.qrSrc;
        img.alt = 'Código QR de acceso';
        qrEl.appendChild(img);
      }
    }

    // Ejemplo de uso (comentado). Descomenta y ajusta los datos:
    // generateBadge(document.querySelector('.escarapela'), {
    //   nombre: 'Laura Gómez',
    //   organizacion: 'Fundación Avanza',
    //   fecha: '04 de diciembre, 2026',
    //   qrSrc: 'https://tu-dominio.com/qr/laura-gomez.png'
    // });
  </script>

</body>
</html>
